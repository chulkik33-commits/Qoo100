name: Qoo10 Detail Field Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/probe_detail_fields.py'
      - '.github/workflows/detail_field_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python qoo10/probe_detail_fields.py
