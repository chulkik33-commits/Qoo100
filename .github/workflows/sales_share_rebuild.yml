name: Qoo10 Sales Share Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/collect_sales_share.py'
      - 'qoo10/resell_brand_universe.csv'
      - '.github/workflows/sales_share_rebuild.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Rebuild using seller sales units
        run: python qoo10/collect_sales_share.py
      - name: Upload sales-based indexes
        uses: actions/upload-artifact@v4
        with:
          name: qoo10-sales-share-${{ github.run_id }}
          path: qoo10/output_sales/
          retention-days: 90
