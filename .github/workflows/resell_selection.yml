name: Qoo10 Resell Selection DB

on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/resell_selection.py'
      - 'qoo10/resell_brand_universe.csv'
      - 'qoo10/resell_cost_input.csv'
      - '.github/workflows/resell_selection.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build raw-data-backed reseller database
        run: python qoo10/resell_selection.py
      - name: Upload reseller database and raw evidence
        uses: actions/upload-artifact@v4
        with:
          name: qoo10-resell-selection-${{ github.run_id }}
          path: qoo10/output_resell/
          retention-days: 90
