name: Qoo10 OliveYoung Top100 Brand Index
on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/oliveyoung_top100_brand_universe.csv'
      - 'qoo10/collect_top100_brand_index.py'
      - '.github/workflows/top100_brand_index.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.55.0 beautifulsoup4==4.12.3
          python -m playwright install --with-deps chromium
      - run: python qoo10/collect_top100_brand_index.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo10-oliveyoung-top100-brand-index-${{ github.run_id }}
          path: qoo10/output_top100_brand_index/
          retention-days: 90
