name: Qoo10 Top3 Deep Recheck

on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/collect_top3_deep.py'
      - 'qoo10/resell_brand_universe_top3.csv'
      - '.github/workflows/top3_deep_recheck.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Deep recollect top 3 brands
        run: python qoo10/collect_top3_deep.py
      - name: Upload deep recheck
        uses: actions/upload-artifact@v4
        with:
          name: qoo10-top3-deep-${{ github.run_id }}
          path: qoo10/output_top3_deep/
          retention-days: 90
