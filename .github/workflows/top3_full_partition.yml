name: Qoo10 Top3 Full Partition Census
on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/collect_top3_full_partition.py'
      - '.github/workflows/top3_full_partition.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.55.0 beautifulsoup4==4.12.3
          python -m playwright install --with-deps chromium
      - run: python qoo10/collect_top3_full_partition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo10-top3-full-partition-${{ github.run_id }}
          path: qoo10/output_top3_full_partition/
          retention-days: 90
