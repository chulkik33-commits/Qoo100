name: Qoo10 Top3 Census Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/collect_top3_census.py'
      - 'qoo10/resell_brand_universe_top3.csv'
      - '.github/workflows/top3_census.yml'

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install playwright==1.55.0 beautifulsoup4==4.12.3
          python -m playwright install --with-deps chromium
      - name: Run exhaustive census
        run: python qoo10/collect_top3_census.py
      - name: Upload census data
        uses: actions/upload-artifact@v4
        with:
          name: qoo10-top3-census-${{ github.run_id }}
          path: qoo10/output_top3_census/
          retention-days: 90
