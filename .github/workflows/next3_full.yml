name: Qoo10 Next3 Full Candidate Census
on:
  workflow_dispatch:
  push:
    paths:
      - 'qoo10/collect_next3_full.py'
      - 'qoo10/next_candidate_brands.csv'
      - '.github/workflows/next3_full.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.55.0 beautifulsoup4==4.12.3
          python -m playwright install --with-deps chromium
      - run: python qoo10/collect_next3_full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoo10-next3-full-${{ github.run_id }}
          path: qoo10/output_next3_full/
          retention-days: 90
